<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heat Transfer Classifier - Radiation, Conduction, Convection</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: top;
            min-height: 100vh;
            margin: 0;
            padding: 30px;
            box-sizing: border-box;
        }
        .quiz-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 780px;
            padding: 28px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 12px;
        }
        .score-row {
            display: flex;
            justify-content: space-around;
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 16px;
        }
        .correct { color: #2ecc71; }
        .incorrect { color: #e74c3c; }
        .graphic-container {
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            position: relative;
            background-color: #f8fafc;
            margin-bottom: 20px;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .id-badge {
            position: absolute;
            top: 8px;
            right: 12px;
            font-size: 11px;
            color: #aaa;
            font-family: monospace;
        }
        .statement-text {
            font-size: 1.25em;
            font-weight: 600;
            color: #2c3e50;
            line-height: 1.4;
            margin-top: 10px;
        }
        .icon-container {
            width: 50px;
            height: 50px;
            margin-bottom: 5px;
        }
        .instruction-banner {
            background-color: #e8f4f8;
            color: #2980b9;
            text-align: center;
            padding: 10px;
            border-radius: 20px;
            font-size: 0.95em;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .feedback-banner {
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.05em;
            margin-bottom: 20px;
            display: none;
        }
        .fb-correct {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .fb-incorrect {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .button-row {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-rad { background-color: #e74c3c; color: white; }
        .btn-rad:hover { background-color: #c0392b; }
        
        .btn-cond { background-color: #e67e22; color: white; }
        .btn-cond:hover { background-color: #d35400; }

        .btn-conv { background-color: #3498db; color: white; }
        .btn-conv:hover { background-color: #2980b9; }

        .btn-next {
            background-color: #2ecc71;
            color: white;
            display: none;
        }
        .btn-next:hover { background-color: #27ae60; }

        .progress-text {
            text-align: center;
            font-size: 0.9em;
            color: #7f8c8d;
            margin-top: 15px;
        }
        .completion-box {
            text-align: center;
            padding: 20px;
        }
        .completion-title {
            color: #2ecc71;
            font-size: 1.8em;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="quiz-card">
    <h2>Heat Transfer: Weather & Energy Classifier</h2>
    
    <div class="score-row">
        <span class="correct">Correct: <span id="correct-count">0</span> / 10 Target</span>
        <span class="incorrect">Incorrect: <span id="incorrect-count">0</span></span>
    </div>

    <div class="graphic-container" id="display-card">
        <span class="id-badge">ID: <span id="sim-id">---------</span></span>
        <div class="icon-container" id="svg-icon"></div>
        <div id="statement-display" class="statement-text">Loading statement...</div>
    </div>

    <div id="instruction" class="instruction-banner">
        Identify the primary heat transfer method: Radiation, Conduction, or Convection.
    </div>

    <div id="feedback" class="feedback-banner"></div>

    <div class="button-row" id="action-buttons">
        <button class="btn btn-rad" onclick="submitAnswer('Radiation')">☀️ Radiation</button>
        <button class="btn btn-cond" onclick="submitAnswer('Conduction')">🤝 Conduction</button>
        <button class="btn btn-conv" onclick="submitAnswer('Convection')">🌀 Convection</button>
    </div>
    
    <div class="button-row">
        <button id="next-btn" class="btn btn-next" onclick="loadNextStatement()">Next Statement ➔</button>
    </div>

    <div class="progress-text" id="progress-display">
        Target: Reach 10 Correct Answers
    </div>
</div>

<script>
    // Contextual neutral icons that DO NOT reveal the heat mechanism
    const icons = {
        road: `<svg viewBox="0 0 24 24" fill="none" stroke="#2c3e50" stroke-width="2"><path d="M4 22L8 2h8l4 20"/><line x1="12" y1="4" x2="12" y2="6"/><line x1="12" y1="10" x2="12" y2="12"/><line x1="12" y1="16" x2="12" y2="18"/></svg>`,
        house: `<svg viewBox="0 0 24 24" fill="none" stroke="#2c3e50" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
        fire: `<svg viewBox="0 0 24 24" fill="none" stroke="#2c3e50" stroke-width="2"><path d="M12 2c1.1 0 2.8 1.6 3 3 1.2 0 2.8 1.1 3 3 .8.8 1 2.2 1 3.5C19 16 15.9 20 12 20s-7-4-7-8.5c0-1.3.2-2.7 1-3.5.2-1.9 1.8-3 3-3 .2-1.4 1.9-3 3-3z"/></svg>`,
        kitchen: `<svg viewBox="0 0 24 24" fill="none" stroke="#2c3e50" stroke-width="2"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>`,
        weather: `<svg viewBox="0 0 24 24" fill="none" stroke="#2c3e50" stroke-width="2"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9z"/></svg>`,
        ocean: `<svg viewBox="0 0 24 24" fill="none" stroke="#2c3e50" stroke-width="2"><path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.5 0 2.5 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.5 0 2.5 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.5 0 2.5 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/></svg>`
    };

    const statementBank = [
        // --- RADIATION (10) ---
        { text: "Sunlight warms the dark asphalt on the Trans-Canada Highway near Deer Lake.", type: "Radiation", icon: "road", reason: "Energy travels across space from the Sun via electromagnetic waves without requiring matter." },
        { text: "Standing near a roaring woodstove in a cabin keeps you warm without touching it.", type: "Radiation", icon: "house", reason: "Infrared heat waves radiate outward from the stove through the air." },
        { text: "Solar panels on a roof in St. John's absorb energy directly from sunlight.", type: "Radiation", icon: "house", reason: "Radiant solar energy travels directly from the Sun to the panel surface." },
        { text: "The ground cools down quickly on a clear night as heat escapes into space.", type: "Radiation", icon: "weather", reason: "Thermal radiation escapes directly from Earth's surface out into the atmosphere." },
        { text: "You feel warmth on your face from a campfire while beachcombing in Conception Bay.", type: "Radiation", icon: "fire", reason: "Infrared radiation travels outward from the fire directly to your skin." },
        { text: "An infrared heat lamp keeps newly hatched chicks warm in a coop.", type: "Radiation", icon: "house", reason: "Radiant heat waves travel directly to objects without needing air currents." },
        { text: "The roof of a black car gets extremely hot while parked in the sun at the mall.", type: "Radiation", icon: "road", reason: "Dark surfaces absorb electromagnetic radiation directly from sunlight." },
        { text: "Microwaves heat up food by sending energy waves through the air inside.", type: "Radiation", icon: "kitchen", reason: "Electromagnetic microwave radiation energizes water molecules in the food directly." },
        { text: "Earth's atmosphere is primarily heated from below as the ground radiates heat upward.", type: "Radiation", icon: "weather", reason: "The ground re-emits absorbed solar energy back upward as terrestrial radiation." },
        { text: "A thermal imaging camera detects heat signatures coming off wild moose in the dark.", type: "Radiation", icon: "weather", reason: "Living organisms continuously emit invisible infrared radiation." },

        // --- CONDUCTION (10) ---
        { text: "Warm air directly touching the cold ocean surface cools down to form sea fog.", type: "Conduction", icon: "ocean", reason: "Heat transfers directly through physical contact between air molecules and cold water." },
        { text: "A metal spoon left in a hot bowl of moose stew quickly becomes too hot to hold.", type: "Conduction", icon: "kitchen", reason: "Heat moves directly molecule-to-molecule along the solid metal handle." },
        { text: "Ice melts rapidly when placed directly on a warm metal kitchen counter.", type: "Conduction", icon: "kitchen", reason: "Direct physical contact transfers heat efficiently from metal to ice." },
        { text: "Walking barefoot on cold tile floors in the winter pulls heat out of your feet.", type: "Conduction", icon: "house", reason: "Direct contact allows heat to flow from your warm skin into the cooler tile." },
        { text: "A cast iron skillet warms up evenly when placed on a hot stove element.", type: "Conduction", icon: "kitchen", reason: "Heat transfers directly through contact from the burner into the metal pan." },
        { text: "Bare skin touching a cold metal pole in Labrador City in January causes instant frostnip.", type: "Conduction", icon: "weather", reason: "Metal is a strong conductor, rapidly pulling heat from warm skin upon contact." },
        { text: "The bottom layer of air warms up when it makes direct contact with sun-baked soil.", type: "Conduction", icon: "road", reason: "Heat transfers directly from the warm ground surface into the molecules of the air above it." },
        { text: "Double-pane windows use a layer of trapped air to reduce heat escaping a home.", type: "Conduction", icon: "house", reason: "Trapped air acts as a poor conductor (insulator), slowing heat loss by contact." },
        { text: "A hot mug of tea warms up your cold hands when you hold onto it.", type: "Conduction", icon: "kitchen", reason: "Direct contact allows heat to travel from the ceramic mug into your palms." },
        { text: "Snow melts on the driveway right where hot exhaust pipes hang near the ground.", type: "Conduction", icon: "road", reason: "Hot exhaust gases touch and transfer heat directly to the snow layer below." },

        // --- CONVECTION (10) ---
        { text: "Warm air rises over land while cool ocean air rushes in, creating a coastal sea breeze.", type: "Convection", icon: "ocean", reason: "Unequal heating causes warm, less dense air to rise and cool air to flow in to replace it." },
        { text: "A thunderstorm develops as warm, humid air rapidly rises into the upper atmosphere.", type: "Convection", icon: "weather", reason: "Strong updrafts of rising warm air create convective storm cells." },
        { text: "Water boiling in a pot circulates as hot water rises from the bottom and cooler water sinks.", type: "Convection", icon: "kitchen", reason: "Density differences in liquids create continuous circulation currents." },
        { text: "Warm air near a baseboard heater rises up to the ceiling, pushing cool air down.", type: "Convection", icon: "house", reason: "Heat creates air movement cycles as warm air expands, gets lighter, and rises." },
        { text: "The Labrador Current brings cold arctic water moving southward along the coast.", type: "Convection", icon: "ocean", reason: "Large-scale ocean currents move thermal energy via bulk fluid motion." },
        { text: "A hot air balloon rises into the sky when the burner heats the air inside it.", type: "Convection", icon: "weather", reason: "Hotter air becomes less dense than surrounding cool air, creating buoyant lift." },
        { text: "Smoke and hot air travel straight up the chimney from a fireplace.", type: "Convection", icon: "fire", reason: "Hot, low-density gases naturally rise through cooler surrounding air." },
        { text: "Magma inside the Earth's mantle slowly rises and sinks, driving plate tectonics.", type: "Convection", icon: "weather", reason: "Deep mantle heat creates slow-moving thermal convection currents in liquid rock." },
        { text: "Glider pilots use rising columns of warm air (thermals) to stay afloat.", type: "Convection", icon: "weather", reason: "Pockets of buoyant warm air rise through cooler atmospheric layers." },
        { text: "A ceiling fan helps circulate warm air that has collected near the top of a high room.", type: "Convection", icon: "house", reason: "Assisting the natural movement of air currents circulates heat through a fluid layer." }
    ];

    let shuffledBank = [];
    let currentIndex = 0;
    let correctTotal = 0;
    let incorrectTotal = 0;
    const TARGET_CORRECT = 10;

    function generateId() {
        const now = new Date();
        const fullYearString = String(now.getFullYear());
        const yearDigit = fullYearString.charAt(fullYearString.length - 1);
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const randomDigits = String(Math.floor(1000 + Math.random() * 9000));
        return `${yearDigit}${month}${day}${randomDigits}`;
    }

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function initQuiz() {
        // Rebuild card structural layout to clear out any completion screen state
        const card = document.getElementById("display-card");
        card.innerHTML = `
            <span class="id-badge">ID: <span id="sim-id">${generateId()}</span></span>
            <div class="icon-container" id="svg-icon"></div>
            <div id="statement-display" class="statement-text">Loading statement...</div>
        `;

        shuffledBank = shuffleArray(statementBank);
        currentIndex = 0;
        correctTotal = 0;
        incorrectTotal = 0;
        document.getElementById("correct-count").innerText = "0";
        document.getElementById("incorrect-count").innerText = "0";
        
        const nextBtn = document.getElementById("next-btn");
        nextBtn.onclick = loadNextStatement;

        document.getElementById("instruction").style.display = "block";
        document.getElementById("progress-display").style.display = "block";
        displayCurrentStatement();
    }

    function displayCurrentStatement() {
        const current = shuffledBank[currentIndex];
        document.getElementById("svg-icon").innerHTML = icons[current.icon];
        document.getElementById("statement-display").innerText = `"${current.text}"`;
        
        document.getElementById("feedback").style.display = "none";
        document.getElementById("instruction").style.display = "block";
        document.getElementById("action-buttons").style.display = "flex";
        document.getElementById("next-btn").style.display = "none";
    }

    function submitAnswer(selectedType) {
        const current = shuffledBank[currentIndex];
        const feedbackEl = document.getElementById("feedback");
        const instructionEl = document.getElementById("instruction");
        const actionBtns = document.getElementById("action-buttons");
        const nextBtn = document.getElementById("next-btn");

        instructionEl.style.display = "none";
        actionBtns.style.display = "none";

        if (selectedType === current.type) {
            correctTotal++;
            document.getElementById("correct-count").innerText = correctTotal;
            feedbackEl.className = "feedback-banner fb-correct";
            feedbackEl.innerHTML = ` Correct! This is an example of <strong>${current.type}</strong>.<br><small>${current.reason}</small>`;
        } else {
            incorrectTotal++;
            document.getElementById("incorrect-count").innerText = incorrectTotal;
            feedbackEl.className = "feedback-banner fb-incorrect";
            feedbackEl.innerHTML = ` Incorrect. This is actually an example of <strong>${current.type}</strong>.<br><small>${current.reason}</small>`;
        }

        feedbackEl.style.display = "block";

        if (correctTotal >= TARGET_CORRECT) {
            nextBtn.innerText = "View Final Results 🏆";
        } else {
            nextBtn.innerText = "Next Statement ➔";
        }
        nextBtn.style.display = "block";
    }

    function loadNextStatement() {
        if (correctTotal >= TARGET_CORRECT) {
            showCompletionScreen();
            return;
        }

        currentIndex++;
        if (currentIndex >= shuffledBank.length) {
            shuffledBank = shuffleArray(statementBank);
            currentIndex = 0;
        }
        displayCurrentStatement();
    }

    function showCompletionScreen() {
        document.getElementById("instruction").style.display = "none";
        document.getElementById("feedback").style.display = "none";
        document.getElementById("action-buttons").style.display = "none";
        document.getElementById("progress-display").style.display = "none";
        
        const card = document.getElementById("display-card");
        card.innerHTML = `
            <div class="completion-box">
                <div class="completion-title">🎉 Heat Transfer Challenge Complete!</div>
                <p><strong>Excellent work!</strong> You mastered 10 statements on Radiation, Conduction, and Convection.</p>
                <p>Total Attempts: <strong>${correctTotal + incorrectTotal}</strong></p>
                <p>Incorrect Attempts: <strong>${incorrectTotal}</strong></p>
            </div>
        `;

        const nextBtn = document.getElementById("next-btn");
        nextBtn.innerText = "Restart Activity 🔄";
        nextBtn.style.display = "block";
        nextBtn.onclick = function() {
            initQuiz();
        };
    }

    window.onload = initQuiz;
</script>

</body>
</html>
